<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Management System - Select Role</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/logo/logo.png">
    
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <!-- Utility and Rendering Scripts -->
    <script src="../js/util.js" defer></script>
    <script src="../js/render.js" defer></script>
    
    <!-- Layout Component Scripts -->
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
    <script src="../js/components/modals.js" type="module" defer></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <!-- Dynamic Header Placeholder -->
            <div id="header"></div>
            
            <!-- Main Content Area -->
            <main class="main-content">
                <h2>Select Your Role</h2>
                <div class="role-buttons">
                    <button id="adminBtn" class="dashboard-btn" onclick="selectRole('admin')">Admin</button>
                    <button id="doctorBtn" class="dashboard-btn" onclick="selectRole('doctor')">Doctor</button>
                    <button id="patientBtn" class="dashboard-btn" onclick="selectRole('patient')">Patient</button>
                </div>
            </main>
            
            <!-- Dynamic Footer Placeholder -->
            <div id="footer"></div>
        </div>
    </div>

    <!-- Hidden Modal Structure -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Service Script -->
    <script type="module" src="../js/services/index.js" defer></script>
</body>
</html>
