<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}">
    
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    
    <!-- Utility and Rendering Scripts -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    
    <!-- Layout Component Scripts -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
</head>
<body onload='renderContent()'>
    <div class="container">
        <div class="wrapper">
            <!-- Dynamic Header Placeholder -->
            <div id="header"></div>
            
            <!-- Main Content Area -->
            <main class="main-content">
                <!-- Search Bar -->
                <input type="text" id="searchBar" placeholder="Search by doctor name" />
                
                <!-- Filter Section -->
                <div class="filter-wrapper">
                    <select class="filter-select" id="filterTime">
                        <option value="">Filter by Time</option>
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>
                    <select class="filter-select" id="filterSpecialty">
                        <option value="">Filter by Specialty</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Dermatology">Dermatology</option>
                        <option value="Pediatrics">Pediatrics</option>
                    </select>
                </div>
                
                <!-- Dynamic Content Container for Doctor Cards -->
                <div id="content"></div>
            </main>
            
            <!-- Dynamic Footer Placeholder -->
            <div id="footer"></div>
        </div>
    </div>

    <!-- Reusable Modal Structure -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Service and Component Scripts (Fixed with Thymeleaf paths and included modals.js) -->
    <script type="module" th:src="@{/js/components/modals.js}" defer></script>
    <script type="module" th:src="@{/js/adminDashboard.js}" defer></script>
    <script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>

</body>
</html>
